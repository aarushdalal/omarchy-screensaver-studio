<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA709A"/>
      <stop offset="100%" stop-color="#FEE140"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FA709A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FA709A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#262b3a" stroke-width="2"/>
  <circle cx="64" cy="64" r="44" fill="url(#halo)"/>

  <!-- Celestial Elliptical Orbits -->
  <ellipse cx="64" cy="64" rx="42" ry="18" transform="rotate(-30 64 64)" fill="none" stroke="#3d465c" stroke-width="2" stroke-dasharray="4 4"/>
  <ellipse cx="64" cy="64" rx="42" ry="18" transform="rotate(30 64 64)" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Orbiting Nodes -->
  <circle cx="34" cy="46" r="3.5" fill="#FEE140"/>
  <circle cx="94" cy="82" r="3.5" fill="#FA709A"/>

  <!-- Center Luminous Aperture Core -->
  <circle cx="64" cy="64" r="14" fill="#13161f" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="7" fill="url(#orbitGrad)"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff"/>
</svg>